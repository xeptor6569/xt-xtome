services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: xtome
      POSTGRES_PASSWORD: xtome
      POSTGRES_DB: xtome
    ports:
      - "5432:5432"
    volumes:
      - xtome_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xtome -d xtome"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data
    environment:
      MINIO_ROOT_USER: xtome
      MINIO_ROOT_PASSWORD: xtome-secret
    ports:
      - "9000:9000"
    volumes:
      - xtome_media:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  xtome_pg:
  xtome_media:
