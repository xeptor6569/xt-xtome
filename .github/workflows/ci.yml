name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "xtome:${GITHUB_SHA}" .
      - name: Deploy compose project
        env:
          XTOME_IMAGE: xtome:${{ github.sha }}
        run: docker compose --env-file /etc/xtome/stack.env -f deploy/compose.yml up -d --remove-orphans --pull never
